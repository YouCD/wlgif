[package]
name = "wlgif"
version = "0.2.0"
edition = "2024"
description = "Lightweight screen recorder for Wayland that captures regions as GIFs"
homepage = "https://github.com/doprz/wlgif"
repository = "https://github.com/doprz/wlgif"
readme = "README.md"
license = "MIT"
keywords = ["wayland", "gif", "screen-recording", "wlroots", "linux"]
categories = ["command-line-utilities", "multimedia"]
exclude = [
    "nix/",
    "*.nix",
    "flake.lock",
    ".editorconfig",
    "justfile",
    ".envrc",
    ".github"
]

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:image"]

[dependencies]
anyhow = "1.0.100"
ashpd = "0.12.0"
clap = { version = "4.5.53", features = ["derive"] }
colored = "3.0.0"
const_format = "0.2.35"
ctrlc = "3.5.1"
# No default features: `accesskit` panics on startup (its zbus D-Bus
# connection requires a Tokio runtime), and the wgpu renderer is overkill
# for a 2D app.
eframe = {
    version = "0.36.2",
    optional = true,
    default-features = false,
    features = ["default_fonts", "glow", "wayland", "x11"],
}
egui = { version = "0.36.2", optional = true }
gstreamer = "0.24.4"
image = { version = "0.25", optional = true, default-features = false, features = ["png", "gif"] }
libc = "0.2.178"
tempfile = "3.24.0"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
# Native screencopy (wlroots compositors) — used by the CLI's native
# recording backend and the GUI's screen snapshot; `grim` remains the GUI
# fallback for compositors that don't implement the protocol. `unstable`
# enables `zxdg-output-v1` for reliable logical output geometry.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", default-features = false, features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
which = "8.0.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
